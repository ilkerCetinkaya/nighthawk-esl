<text x="40.0" y="60.0" font-size="12" text-anchor="start" font-family="Helvetica,Arial,sans-serif">1) TI AN043 IFA, 15.2 x 5.7 mm (SWRA117D fig. 3, table 1; reconstructed from the figure)</text>
