<text x="805.0" y="535" font-size="11" text-anchor="middle">VEMD10940F + OPA356 TIA</text>
<text x="805.0" y="550" font-size="11" text-anchor="middle">(Pricer IR, 1.25 MHz carrier [S])</text>
