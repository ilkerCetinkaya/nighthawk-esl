<text x="960" y="470" font-size="11">IR TX/RX timing</text>
<text x="30" y="730" font-size="12">No plug-in RF modules or RF expansion connectors. All RF transceivers, matching, test ports and antennas are on the single 80 x 40 mm 4-layer PCB. Transmit paths are powered only through the hardware interlock.</text>
