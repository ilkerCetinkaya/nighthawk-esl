<text x="445.0" y="270" font-size="11" text-anchor="middle">host, USB-CDC CLI, storage task</text>
<text x="445.0" y="285" font-size="11" text-anchor="middle">supervisor (WDI, ARM)</text>
<text x="445.0" y="300" font-size="11" text-anchor="middle">own 2.4 GHz antenna (radio off</text>
