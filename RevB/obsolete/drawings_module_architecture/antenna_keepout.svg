<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="940" viewBox="0 0 1220 940" font-family="Helvetica,Arial,sans-serif">
<rect width="1220" height="940" fill="#ffffff"/>
<text x="210" y="24" font-size="17" font-weight="bold">ESP32-C3-WROOM-02 antenna keepout (Espressif HW design guidelines figure, applied)</text>
<rect x="60.0" y="60.0" width="210.0" height="480.0" fill="#d62728" fill-opacity="0.07" stroke="#d62728" stroke-width="1.5" stroke-dasharray="7 4"/>
<path d="M 210.0 610.0 L 1010.0 610.0 L 1010.0 210.0 L 270.0 210.0 L 270.0 540.0 L 210.0 540.0 Z" fill="#e8f0e3" stroke="#1b5e20" stroke-width="2"/>
<rect x="270.0" y="210.0" width="140.0" height="180.0" fill="#4c78a8" fill-opacity="0.55" stroke="#222" stroke-width="1.2"/>
<rect x="210.0" y="210.0" width="60.0" height="180.0" fill="#4c78a8" fill-opacity="0.25" stroke="#4c78a8" stroke-width="1.5"/>
<text x="240.0" y="300.0" font-size="10" text-anchor="middle" transform="rotate(-90 240.0 300.0)">ESP32 antenna 6x18 (overhang)</text>
<line x1="60.0" y1="195.0" x2="210.0" y2="195.0" stroke="#d62728" stroke-width="1.2"/>
<text x="135.0" y="191.0" font-size="11" fill="#d62728" text-anchor="middle">15 (min)</text>
<line x1="60.0" y1="410.0" x2="210.0" y2="410.0" stroke="#d62728" stroke-width="1.2"/>
<text x="135.0" y="406.0" font-size="11" fill="#d62728" text-anchor="middle"></text>
<line x1="240.0" y1="390.0" x2="240.0" y2="540.0" stroke="#d62728" stroke-width="1.2"/>
<text x="262.0" y="461.0" font-size="11" fill="#d62728" text-anchor="middle">15 min</text>
<line x1="210.0" y1="195.0" x2="270.0" y2="195.0" stroke="#d62728" stroke-width="1.2"/>
<text x="240.0" y="191.0" font-size="11" fill="#d62728" text-anchor="middle">6</text>
<rect x="505.0" y="210.0" width="505.0" height="205.0" fill="#e45756" fill-opacity="0.15" stroke="#e45756" stroke-dasharray="5 3"/>
<text x="757.5" y="312.5" font-size="11" text-anchor="middle">battery (bottom), 23.5 mm from antenna</text>
<text x="340.0" y="300.0" font-size="11" text-anchor="middle" fill="#fff">module body</text>
<text x="210" y="840" font-size="12">Antenna strip 18 x 6 mm overhangs the board: board cut away under it and 15 mm on both sides along the edge (notch x 0-6, y 7-40).</text>
<text x="210" y="860" font-size="12">Red dashed: clearance area per Espressif 'Keepout Zone for ESP32-C3 Module's Antenna' (min 15 mm left/right and outward).</text>
<text x="210" y="880" font-size="12">Inside the product housing: >= 15 mm free space around the antenna in all directions (Espressif recommendation) -> enclosure wall >= 15 mm beyond x = 0.</text>
<text x="210" y="900" font-size="12">No copper on any layer, no components, no battery, no shield can inside the clearance area. Dense GND vias along the notch edge and module body.</text>
</svg>