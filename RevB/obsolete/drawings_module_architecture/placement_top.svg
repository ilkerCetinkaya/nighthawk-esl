<text x="80" y="551" font-size="12">ESP32: ESP32-C3-WROOM-02-N4 body 14x18 on board; antenna strip 6x18 over the notch</text>
<rect x="60" y="558" width="14" height="12" fill="#9d755d" fill-opacity="0.6" stroke="#222"/>
