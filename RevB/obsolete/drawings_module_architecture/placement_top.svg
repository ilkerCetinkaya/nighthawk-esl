<rect x="60" y="576" width="14" height="12" fill="#bab0ac" fill-opacity="0.6" stroke="#222"/>
<text x="80" y="587" font-size="12">USB_ESD: TPD2E2U06 ESD, 2x5.1k CC, PTC, 10uF</text>
<rect x="60" y="594" width="14" height="12" fill="#f2cf5b" fill-opacity="0.6" stroke="#222"/>
