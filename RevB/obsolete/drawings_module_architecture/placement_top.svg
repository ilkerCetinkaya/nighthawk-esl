<rect x="60" y="630" width="14" height="12" fill="#f58518" fill-opacity="0.6" stroke="#222"/>
<text x="80" y="641" font-size="12">CHG: BQ24074 linear charger + ILIM/ISET/TS parts (heat source, kept off the cell)</text>
<rect x="60" y="648" width="14" height="12" fill="#d62728" fill-opacity="0.6" stroke="#222"/>
<text x="80" y="659" font-size="12">REG: TPS63802 buck-boost + 0.47 uH (DFE201612E class), 2x TLV755P LDO, under removable can</text>
<rect x="60" y="666" width="14" height="12" fill="#72b7b2" fill-opacity="0.6" stroke="#222"/>
<text x="80" y="677" font-size="12">DIG1: TCA9555 x2, TPS22918 x2 load switches, pull-ups, decoupling</text>
<rect x="60" y="684" width="14" height="12" fill="#54a24b" fill-opacity="0.6" stroke="#222"/>
<text x="80" y="695" font-size="12">JST_M1: RF module 1 connector JST SH 15-pin</text>
